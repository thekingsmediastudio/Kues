<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 58 61" role="img" aria-label="Parcel cartoon agent avatar"><style>.avatar-art{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out infinite}.avatar-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}.eye-b{animation-delay:.11s}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46.2%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.avatar-art,.avatar-eye{animation:none!important}}</style><g class="avatar-art"><path d="m9 19 23-11 23 11v28L32 58 9 47V19Z" fill="#e7a94b" stroke="#111113" stroke-width="3" stroke-linejoin="round"/><path d="m9.5 19.5 22.5 11 22.5-11M32 30.5V57" fill="none" stroke="#111113" stroke-width="2.5" stroke-linejoin="round"/><path d="m21 13 22 11v8" fill="none" stroke="#111113" stroke-opacity=".5" stroke-width="2.5" stroke-linejoin="round"/><g><ellipse class="avatar-eye eye-a" cx="25" cy="38" rx="1.9" ry="2.8" fill="#111113"/><ellipse class="avatar-eye eye-b" cx="39" cy="38" rx="1.9" ry="2.8" fill="#111113"/></g><path d="M27 44c1.3 1.5 2.8 2.2 5 2.2s3.7-.7 5-2.2" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round"/><circle cx="20.5" cy="43" r="1.6" fill="#ef927f"/><circle cx="43.5" cy="43" r="1.6" fill="#ef927f"/></g></svg>
