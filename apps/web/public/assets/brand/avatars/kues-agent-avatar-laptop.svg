<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 4 58 58" role="img" aria-label="Laptop cartoon agent avatar"><style>.avatar-art{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out infinite}.avatar-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}.eye-b{animation-delay:.11s}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46.2%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.avatar-art,.avatar-eye{animation:none!important}}</style><g class="avatar-art"><rect x="8" y="7" width="48" height="37" rx="5.5" fill="#32d583" stroke="#111113" stroke-width="3"/><rect x="13" y="12" width="38" height="27" rx="2.8" fill="#fff" opacity=".23"/><path d="M18 15h8" stroke="#111113" stroke-opacity=".56" stroke-width="2" stroke-linecap="round"/><g><ellipse class="avatar-eye eye-a" cx="26" cy="24" rx="1.9" ry="2.8" fill="#111113"/><ellipse class="avatar-eye eye-b" cx="38" cy="24" rx="1.9" ry="2.8" fill="#111113"/></g><path d="M28 30c1.2 1.5 2.6 2.2 4 2.2s2.8-.7 4-2.2" fill="none" stroke="#111113" stroke-width="2.3" stroke-linecap="round"/><circle cx="21.5" cy="29" r="1.6" fill="#ef927f"/><circle cx="42.5" cy="29" r="1.6" fill="#ef927f"/><path d="M5 48h54l-5 8H10l-5-8Z" fill="#32d583" stroke="#111113" stroke-width="3" stroke-linejoin="round"/><path d="M27 51h10" stroke="#111113" stroke-width="2.3" stroke-linecap="round"/><path d="M12 51h3" stroke="#111113" stroke-opacity=".65" stroke-width="1.8" stroke-linecap="round"/></g></svg>
