<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 4 60 58" role="img" aria-label="Shopping cart cartoon agent avatar"><style>.avatar-art{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out infinite}.avatar-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}.eye-b{animation-delay:.11s}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46.2%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.avatar-art,.avatar-eye{animation:none!important}}</style><g class="avatar-art"><path d="M7 10h8l4.5 27c.4 2.2 2 3.7 4.3 3.7h21.4c2 0 3.7-1.3 4.2-3.2L54 19H17" fill="none" stroke="#111113" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 19h35l-5 18H22L19 19Z" fill="#f39b91" stroke="#111113" stroke-width="3" stroke-linejoin="round"/><g><ellipse class="avatar-eye eye-a" cx="29" cy="27" rx="1.6" ry="2.5" fill="#111113"/><ellipse class="avatar-eye eye-b" cx="41" cy="27" rx="1.6" ry="2.5" fill="#111113"/></g><path d="M30 32c1 1.3 2.1 1.8 3 1.8s2-.5 3-1.8" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round"/><circle cx="25" cy="31" r="1.4" fill="#ef927f"/><circle cx="45" cy="31" r="1.4" fill="#ef927f"/><circle cx="25" cy="49" r="4.2" fill="#f3f3f5" stroke="#111113" stroke-width="3"/><circle cx="45" cy="49" r="4.2" fill="#f3f3f5" stroke="#111113" stroke-width="3"/></g></svg>
