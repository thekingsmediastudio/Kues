<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 3 58 58" role="img" aria-label="Price tag cartoon agent avatar"><style>.avatar-art{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out infinite}.avatar-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}.eye-b{animation-delay:.11s}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46.2%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.avatar-art,.avatar-eye{animation:none!important}}</style><g class="avatar-art"><path d="M9 17c0-2.8 2.2-5 5-5h21l20 20-22 22L9 30V17Z" fill="#f5b942" stroke="#111113" stroke-width="3" stroke-linejoin="round"/><circle cx="17.5" cy="19.5" r="2.8" fill="#f3f3f5" stroke="#111113" stroke-width="2"/><path d="M24 17c2.5-2.2 5.8-3.5 9-3.5" fill="none" stroke="#111113" stroke-opacity=".5" stroke-width="2.2" stroke-linecap="round"/><g><ellipse class="avatar-eye eye-a" cx="30" cy="31" rx="1.8" ry="2.7" fill="#111113"/><ellipse class="avatar-eye eye-b" cx="41" cy="31" rx="1.8" ry="2.7" fill="#111113"/></g><path d="M31 37c1 1.3 2.1 1.9 3.4 1.9s2.4-.6 3.4-1.9" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round"/><circle cx="25" cy="36" r="1.5" fill="#ef927f"/><circle cx="46" cy="36" r="1.5" fill="#ef927f"/></g></svg>
