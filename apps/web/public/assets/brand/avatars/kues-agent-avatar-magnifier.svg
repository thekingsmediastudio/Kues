<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 60 60" role="img" aria-label="Magnifier cartoon agent avatar"><style>.avatar-art{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out infinite}.avatar-eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s ease-in-out infinite}.eye-b{animation-delay:.11s}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}@keyframes blink{0%,45%,48%,100%{transform:scaleY(1)}46.2%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){.avatar-art,.avatar-eye{animation:none!important}}</style><g class="avatar-art"><path d="m42 42 19 19" fill="none" stroke="#111113" stroke-width="9" stroke-linecap="round"/><path d="m42 42 19 19" fill="none" stroke="#111113" stroke-width="5" stroke-linecap="round"/><circle cx="28" cy="28" r="20" fill="#88d7c2" stroke="#111113" stroke-width="3"/><circle cx="28" cy="28" r="15.2" fill="#fff" opacity=".22"/><path d="M17 18c3-4 7-6 11-6" fill="none" stroke="#111113" stroke-opacity=".65" stroke-width="2.3" stroke-linecap="round"/><g><ellipse class="avatar-eye eye-a" cx="23" cy="27" rx="1.8" ry="2.8" fill="#111113"/><ellipse class="avatar-eye eye-b" cx="34" cy="27" rx="1.8" ry="2.8" fill="#111113"/></g><path d="M24 33c1 1.4 2.3 2 3.8 2s2.8-.6 3.8-2" fill="none" stroke="#111113" stroke-width="2.2" stroke-linecap="round"/><circle cx="18.5" cy="32" r="1.5" fill="#ef927f"/><circle cx="38" cy="32" r="1.5" fill="#ef927f"/></g></svg>
