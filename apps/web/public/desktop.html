<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1010">
  <meta http-equiv="refresh" content="0;url=/app">
  <title>Keus dashboard moved</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#0b0e0e;color:#f1f4f0;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,430px);padding:30px;border:1px solid #27312b;border-radius:16px;background:#121717;text-align:center}.mark{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:15px;background:#1b3024;color:#32d583;font-size:25px}.card h1{margin:0 0 8px;font-size:23px;letter-spacing:-.04em}.card p{margin:0 0 20px;color:#a2ada4;font-size:13px}.card a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:8px;background:#32d583;color:#112218;font-size:12px;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">K</div>
    <h1>The Keus dashboard has moved</h1>
    <p>The old workspace preview is retired. Continue to the current account dashboard.</p>
    <a href="/app">Go to the dashboard</a>
  </main>
  <script>location.replace('/app')</script>
</body>
</html>
