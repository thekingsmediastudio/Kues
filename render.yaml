services:
  - type: web
    name: keus-staging
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm --workspace apps/web run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: workos
      - key: PAYPAL_ENV
        value: sandbox
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_GOOGLE_OAUTH_ENABLED
        value: "0"
      - key: WORKOS_GITHUB_OAUTH_ENABLED
        value: "0"
      # PayPal AI Hackathon 2026 competition access: opening through the end of judging.
      # 1 Oct 2026 9:15 AM Pacific = 5:15 PM WAT; judging ends 15 Dec 2026 5:00 PM WAT.
      - key: KEUS_COMPETITION_START_AT
        value: "2026-10-01T17:15:00+01:00"
      - key: KEUS_COMPETITION_END_AT
        value: "2026-12-15T17:00:00+01:00"
      - key: KEUS_COMPETITION_DAILY_TOKEN_LIMIT
        value: "7000000"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: API_HUB_ADMIN_EMAILS
        sync: false
      - key: API_HUB_ENCRYPTION_KEY
        generateValue: true
